[package]
name = "cafe-sys"
version = "0.1.0"
authors = ["29th-Day"]
edition = "2024"
license = "MIT"
keywords = ["wiiu", "homebrew"]
description = "Bindings for the Wii U system APIs"
repository = "https://github.com/rust-wiiu/cafe-sys"
readme = "README.md"
categories = ["external-ffi-bindings", "no-std", "os"]
rust-version = "1.85"

[lib]
test = false
bench = false

[dependencies]
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[features]
rustc-dep-of-std = ["dep:core"]
